[package]
name = "tailbench-phantom"
version = "0.2.0"
edition = "2024"
# The lowest toolchain that checks the workspace (--all-targets) with Cargo.lock.
rust-version = "1.88"
license = "Apache-2.0"
description = "Scripted fake OpenAI-compatible LLM server that logs per-request and per-token ground truth, for auditing latency benchmarks."
repository = "https://github.com/tatavishnurao/tailbench"
homepage = "https://github.com/tatavishnurao/tailbench"
readme = "README.md"
keywords = ["llm", "benchmark", "latency", "sse", "ground-truth"]
categories = ["development-tools::testing", "command-line-utilities"]
# Tests, audits and docs/ stay in the repository. Leading / anchors a pattern
# at the package root: a bare "README.md" would also match docs/audits/README.md.
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

# The library keeps its old name, so `use phantom::...` is unchanged.
[lib]
name = "phantom"

[[bin]]
name = "phantom"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
# stream::unfold turns the token channel into the Stream axum's Sse wants. Already
# in the tree through axum (same version, no features), so it adds no crate.
futures-util = { version = "0.3.34", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Held at the version tailbench locks, so adding phantom does not move tailbench's
# dependency tree. signal: SIGINT/SIGTERM trigger the graceful shutdown that
# flushes the log.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
# phantom demo drives phantom with tailbench's closed-loop and open-loop
# runners. The path is for this workspace; published, it is tailbench 0.1.0.
tailbench = { path = "..", version = "0.1.0" }

[dev-dependencies]
# Loopback HTTP only: default features (TLS, HTTP/2, proxy discovery) are not needed.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
