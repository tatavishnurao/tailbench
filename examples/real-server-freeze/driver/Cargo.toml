[package]
name = "rs-drive"
version = "0.0.0"
edition = "2024"
publish = false
description = "Drives an OpenAI-compatible /v1/completions endpoint with tailbench's open-loop or closed-loop runner."

# Not part of the repository workspace.
[workspace]

[dependencies]
tailbench = { path = "../../.." }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1.0.154"
