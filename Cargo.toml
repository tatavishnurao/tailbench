[package]
name = "tailbench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Open-loop, coordinated-omission-safe latency harness"

[dependencies]
# Default features (serialization, sync) are not needed: we only record and query.
hdrhistogram = { version = "7.6.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# rt: JoinSet / task spawning. time: Instant, sleep_until.
tokio = { version = "1.53.3", features = ["rt", "time"] }

[dev-dependencies]
# macros: #[tokio::test]. test-util: start_paused (the paused clock).
tokio = { version = "1.53.3", features = ["macros", "test-util"] }
